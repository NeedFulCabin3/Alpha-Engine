name: Python Code Health & Validator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Core Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy ccxt flake8

    - name: Code Syntax and Lint Validation
      run: |
        # Stop build if there are Python syntax errors or undefined symbols
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit zero allows warnings for style issues without blocking pipeline
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Execute Main Validation Engine
      run: |
        python main.py